<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <script>
        class Staff {
            constructor (name, role, salary) {
                this.name = name;
                this.role = role;
                this.salary = salary;
            }

            display () {
                console.log("Name: " + this.name);
                console.log(" Role: " + this.role);
                console.log(" Salary: #" +this.salary);
                console.log("------------------------");
            }
        }

        const staffList = [
            new Staff ("John", "Manager", "250,000"),
            new Staff ("Peter", "Accountant", "180,000"),
            new Staff ("Larry", "Developer", "220,000"),
        ];

        staffList.forEach(staff => staff.display());
    </script>
</body>
</html>
