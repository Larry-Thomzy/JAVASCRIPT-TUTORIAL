<html>
    <body>
        <script>
            var score = 30;
            if( score < 40) {
                document.write("<br>Fail<br/>");
            }
            else if(score > 40 && score < 50) {
                document.write("<br>Average<br/>");
            }
            else if( score > 50 && score < 60) {
                document.write("<br>Good<br/>");
            }
            else if( score > 60) {
                document.write("<br>Excellent<br/>");
            }
        </script>
    </body>
</html>
