<!DOCTYPE html>
<html lang="en">
<head>

<body>
    <h1>Object in javascript</h1>
    <p>An Objectv is a collection of properties, and each property has a key(name) and a value</p>
    <p>For example, a personn has propertieslike name, age, and whether the person is a student</p>

    <script>
        const person1 = {
            name:"Sammie Jammie",
            age:78,
            height:6.4
        }
        const person2 = {
            name:"Fright Jeremy",
            age:24,
            height:5.5,
            profession:"No One"
        }
        const person3 = {
            name:"jeremy D.T.B",
            age:32,
            height:4.7,
            profession:"No One"
        }

        // STEP 2: Accessing Object Properties
        console.log(person1);
        console.log(person2);
        console.log(person3);

        // Using Dot Notation
        console.log(person2.name);
        console.log(person3.age);
        console.log(person1.height);

        // Bracket Notation
        console.log(person2["age"]);
        console.log(person3["profession"]);
        console.log(person1["name"]);

        // STEP3: ADDING CHANGING AND DELETING PROPERTIES
        person1.gender = "Male"; // add
        person2.age = 42; // change
        delete person3.profession; // delete
        console.log(person1);

        // NESTED OBJECTS
        const student = {
            name: "Sam-Chase",
            scores : {
                math:98,
                english:70,
                Chemistry:81,
                physics: 70,
            },
            unit:{

        console.log(student.scores.math);
        console.log(student.unit.Chemistry);

            },
            {
                
                name:"Escalladizzy",

            }
        ];
        console.log(FacebookUsers[2].password);
