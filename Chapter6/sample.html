


<html>
    <body>
        <script type="text/javascript">

            var a = 40;
            var b = 80;
            var linebreak = "<br>";
            document.write ("(a && b) =>")
            result = ((a>50) && (b>50));
            document.write(result)
            document.write(linebreak);
            

            document.write("(a || b)=>");
            result = ((a>50) || (b>50));
            document.write (result);
            document.write (linebreak);

            document.write("!(a && b)=>");
            result = (!((a>50) && (b>50)));
            document.write (result);
            document.write (linebreak);
        </script>
        <p>Set the variables to different values and different operators and then try...</p>
    </body>
</html>
