<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Switch Example</title>
</head>
<body>
  <script>
    let day = prompt("Enter a day of the week (e.g., Monday, Friday, Sunday):");

    switch(day) {
      case "Monday":
        alert("Start of the week!");
        break;

      case "Friday":
        alert("Weekend is near!");
        break;

      case "Sunday":
        alert("Rest day!");
        break;

      default:
        alert("Just another day.");
    }


// 🚦 Another Example: Traffic Light
let light = "red";

switch(light) {
  case "green":
    console.log("Go!");
    break;

  case "yellow":
    console.log("Slow down.");
    break;

  case "red":
    console.log("Stop!");
    break;

  default:
    console.log("Invalid color");
}


// grade checker
let score = 85;
let grade;

switch (true) {
  case (score >= 70):
    grade = "A";
    break;

  case (score >= 50):
    grade = "B";
    break;

  case (score >= 40):
    grade = "C";
    break;

  default:
    grade = "F";
}

console.log("Your grade is: " + grade);


  </script>
</body>
</html>
